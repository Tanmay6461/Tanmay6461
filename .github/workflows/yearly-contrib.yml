name: Generate yearly contribution graphs

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/yearly_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add yearly-contrib
          git commit -m "Update yearly contribution graphs" || exit 0
          git push
